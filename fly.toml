# fly.toml app configuration file generated for anxiety-journal-bot on 2026-03-28T00:45:57+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'anxiety-journal-bot'
primary_region = 'lhr'

[build]

# This app polls Telegram with getUpdates, which allows exactly one consumer
# per bot token. A rolling deploy briefly runs the old and new machines at the
# same time, giving two pollers: Telegram answers one with 409 Conflict and
# users get duplicate reminders. "immediate" stops the old machine before the
# new one starts, trading a few seconds of downtime for a single poller.
#
# The other half of this guarantee is machine count, which fly.toml cannot
# express — it must be set once per app, out of band:
#
#     fly scale count 1
#
[deploy]
  strategy = 'immediate'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
