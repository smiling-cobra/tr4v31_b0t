[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    .pytest_cache,
    docs

# main.py calls load_dotenv() before importing anything that reads the
# environment at import time, so its imports are deliberately not at the top.
per-file-ignores =
    main.py:E402
